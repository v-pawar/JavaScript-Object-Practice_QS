<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>object practice</title>
  </head>
  <body>
    <h1>Question 01:</h1>
    <h2>Note : for Answers check console</h2>
    <h3>
      Create a JavaScript object named student with the following properties:
    </h3>
    <h4>name: Vivek age: 22 course: BCS city: Chalisgaon</h4>

    <h1>Tasks</h1>
    <h4>
      Create the student object. Print the complete object. Print the student's
      name. Print the student's age.
    </h4>

    <script>
      const student = {
        name: "vivek",
        age: 22,
        city: "chalisgaon",
        course: "bcs",
      };

      console.log(student);
      console.log("name", student.name);
      console.log("age", student.age);
      console.log("course", student.course);
    </script>
  </body>
</html>
